    - '03: Selection and comparisons': concepts/03-selection-comparisons.md
    - '04: Iteration': concepts/04-iteration.md
    - '05: Boolean logic and state': concepts/05-boolean-logic-state.md
    - '06: Coordinates and boundaries': concepts/06-coordinates-boundaries.md
    - '07: Functions': concepts/07-functions.md
    - '08: Lists and indexing': concepts/08-lists-indexing.md
    - '09: Radio communication': concepts/09-radio-communication.md
    - '10: Integration, testing and evaluation': concepts/10-testing-evaluation.md
  - Practical references:
    - 'Project 01: Pocket personality': '01-pocket-personality.md'
    - 'Project 02: The unfair dice challenge': '02-unfair-dice.md'
    - 'Project 03: Beat the reaction timer': '03-reaction-timer.md'
    - 'Project 04: Protect the treasure': '04-treasure-alarm.md'
    - 'Project 05: Tilt arcade': '05-tilt-arcade.md'
    - 'Project 06: Memory master': '06-memory-master.md'
